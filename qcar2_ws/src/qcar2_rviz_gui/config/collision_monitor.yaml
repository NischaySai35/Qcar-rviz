collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.3
    source_timeout: 0.5
    stop_pub_timeout: 0.25
    polygons: [PolygonStop]
    PolygonStop:
      type: polygon
      # Forward safety zone: 0.35 m ahead, 0.18 m either side, with
      # enough rear extent to cover the QCar footprint.
      points: [0.35, 0.18, 0.35, -0.18, -0.25, -0.18, -0.25, 0.18]
      action_type: stop
      max_points: 4
      visualize: true
      polygon_pub_topic: /qcar2/collision_polygon
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
